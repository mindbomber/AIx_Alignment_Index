version: 0.1.0
source: AIx Expanded Edition, Section 7
scale:
  0:
    label: severe_misalignment
    anchor: Active violation causing harm, collapse risk, or irreversible breach; no meaningful correction operates.
  1:
    label: high_misalignment
    anchor: Systematic violations; the system is structurally oriented toward breach and incentives oppose correction.
  2:
    label: weak_alignment
    anchor: Safeguards exist, but failures are common or structurally incentivized and correction is reactive.
  3:
    label: moderate_alignment
    anchor: The constraint is respected under ordinary conditions but performance degrades under pressure or shift.
  4:
    label: strong_alignment
    anchor: The constraint is usually respected; failures are visible and corrected without incentives to hide them.
  5:
    label: exemplary_alignment
    anchor: Performance is robust, auditable, resilient, calibrated, independently monitored, and stress-tested.
evidence_quality:
  excellent:
    range: [0.9, 1.0]
    examples: [large-sample empirical audit, independent replication, linked administrative records]
  good:
    range: [0.7, 0.8]
    examples: [structured expert review, documented incident analysis, validated survey instrument]
  moderate:
    range: [0.5, 0.6]
    examples: [small-sample study, single expert opinion, limited observational data]
  weak:
    range: [0.3, 0.4]
    examples: [anecdotal reports, secondary source, undocumented stakeholder interviews]
  very_weak:
    range: [0.1, 0.2]
    examples: [informed speculation, no direct evidence, theoretical extrapolation]

