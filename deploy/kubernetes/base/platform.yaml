apiVersion: v1
kind: ServiceAccount
metadata:
  name: aix
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aix-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aix-api
  template:
    metadata:
      labels:
        app: aix-api
    spec:
      serviceAccountName: aix
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/example/aix-open
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: aix-config
            - secretRef:
                name: aix-secrets
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: temporary
              mountPath: /tmp
        - name: clamav
          image: clamav/clamav:1.5.2
          ports:
            - name: clamd
              containerPort: 3310
          readinessProbe:
            tcpSocket:
              port: clamd
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: clamav-definitions
              mountPath: /var/lib/clamav
      volumes:
        - name: temporary
          emptyDir:
            sizeLimit: 256Mi
        - name: clamav-definitions
          emptyDir:
            sizeLimit: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aix-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aix-worker
  template:
    metadata:
      labels:
        app: aix-worker
    spec:
      serviceAccountName: aix
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/example/aix-open
          command: ["aix-worker"]
          envFrom:
            - configMapRef:
                name: aix-config
            - secretRef:
                name: aix-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: temporary
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aix-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aix-web
  template:
    metadata:
      labels:
        app: aix-web
    spec:
      serviceAccountName: aix
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/example/aix-web
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: nginx-temporary
              mountPath: /tmp
      volumes:
        - name: nginx-temporary
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: aix-api
spec:
  selector:
    app: aix-api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: aix-web
spec:
  selector:
    app: aix-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: batch/v1
kind: Job
metadata:
  name: aix-migrate
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: aix-migrate
    spec:
      restartPolicy: OnFailure
      serviceAccountName: aix
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/example/aix-open
          command: ["aix-db", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: aix-config
            - secretRef:
                name: aix-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: aix-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: aix-api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aix-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aix-api
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aix-default-deny-ingress
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 8080
