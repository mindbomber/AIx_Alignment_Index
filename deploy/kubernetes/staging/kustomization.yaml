apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aix-staging
resources:
  - ../base
nameSuffix: -staging
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
images:
  - name: ghcr.io/example/aix-open
    newTag: staging
  - name: ghcr.io/example/aix-web
    newTag: staging
