name: deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment target
        required: true
        type: choice
        options: [staging, production]
      tag:
        description: Published container tag
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install PyYAML
      - name: Normalize image repository
        id: image
        run: echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Configure Kubernetes credentials
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          test -n "$KUBECONFIG_B64"
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBECONFIG_B64" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - name: Deploy migration then workloads
        run: |
          python scripts/deploy_kubernetes.py "${{ inputs.environment }}" \
            --api-image "ghcr.io/${{ steps.image.outputs.repository }}:${{ inputs.tag }}" \
            --web-image "ghcr.io/${{ steps.image.outputs.repository }}-web:${{ inputs.tag }}" \
            --deploy
