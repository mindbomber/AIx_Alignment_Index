name: candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Candidate container tag
        required: true
        default: v0.2.0-rc.1
        type: string

permissions:
  contents: read
  packages: write

jobs:
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ inputs.tag }}
      - uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          tags: ghcr.io/${{ github.repository }}-web:${{ inputs.tag }}
