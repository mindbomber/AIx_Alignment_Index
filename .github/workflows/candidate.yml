name: candidate

on:
  push:
    branches:
      - "codex/**"
  workflow_dispatch:
    inputs:
      tag:
        description: Candidate container tag
        required: true
        default: v0.2.0-rc.1
        type: string

permissions:
  contents: read
  packages: write

env:
  CANDIDATE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || format('candidate-{0}', github.sha) }}

jobs:
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize image repository
        id: image
        run: echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ steps.image.outputs.repository }}:${{ env.CANDIDATE_TAG }}
      - uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          tags: ghcr.io/${{ steps.image.outputs.repository }}-web:${{ env.CANDIDATE_TAG }}
