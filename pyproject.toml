[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aix-open"
version = "0.1.1"
description = "Open-source Alignment Index measurement framework"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{name = "SimulateAI Research Group"}]
keywords = ["alignment", "measurement", "auditing", "ai-safety", "reliability"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = ["PyYAML>=6.0.1", "jsonschema>=4.21", "httpx>=0.28,<1"]

[project.optional-dependencies]
charts = ["matplotlib>=3.8"]
platform = [
  "alembic>=1.18,<2",
  "authlib>=1.6,<2",
  "boto3>=1.42,<2",
  "cryptography>=45,<47",
  "fastapi>=0.136,<1",
  "itsdangerous>=2.2,<3",
  "opentelemetry-api>=1.39,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.39,<2",
  "opentelemetry-instrumentation-fastapi>=0.60b0,<1",
  "opentelemetry-instrumentation-sqlalchemy>=0.60b0,<1",
  "opentelemetry-sdk>=1.39,<2",
  "prometheus-client>=0.23,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.27,<1",
  "redis>=6,<7",
  "sqlalchemy>=2.0,<3",
  "structlog>=25,<26",
  "uvicorn[standard]>=0.34,<1",
]
dev = [
  "build>=1.2",
  "pytest>=9.0.3",
  "pytest-cov>=5",
]

[project.scripts]
aix = "aix.cli:main"
aix-api = "aix_platform.main:run"
aix-db = "aix_platform.migrate:main"
aix-worker = "aix_platform.worker:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/aix/rubrics" = ["rubrics/*.yaml"]
"share/aix/spec" = ["spec/*.json", "spec/*.yaml"]
"share/aix/papers" = ["papers/*.pdf", "papers/*.md"]
"share/aix/migrations" = ["migrations/*.py", "migrations/*.mako", "migrations/README"]
"share/aix/migrations/versions" = ["migrations/versions/*.py"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
source = ["aix", "aix_platform"]
branch = true
